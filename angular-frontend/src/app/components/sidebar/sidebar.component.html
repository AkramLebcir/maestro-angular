<aside class="bg-white dark:bg-gray-800 w-64 shadow-lg p-4 h-full md:h-auto fixed md:static top-16 bottom-0 md:top-auto right-0 z-30">
  <nav class="space-y-2">
    <ng-container *ngFor="let item of menuItems; let i = index">
      <a
        *ngIf="!item.adminOnly || isAdmin"
        (click)="navigate(item.route); setActive(i)"
        [class]="item.active
          ? 'flex items-center gap-3 p-3 rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 cursor-pointer'
          : 'flex items-center gap-3 p-3 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
        </svg>
        <span class="text-sm font-medium">{{ translate(item.labelKey) }}</span>
      </a>
    </ng-container>
  </nav>
</aside>
