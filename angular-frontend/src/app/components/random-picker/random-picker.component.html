
<div *ngIf="selectedStudent" class="relative mt-4 p-4 w-full bg-green-50 dark:bg-green-900/20 rounded-lg text-center border border-green-200 dark:border-green-700">
  <button 
    (click)="clearSelectedStudent()"
    class="absolute top-2 right-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:text-gray-300">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
  <h4 class="text-lg font-semibold text-green-800 dark:text-green-200 mb-2">{{ getTranslatedText('pickedStudent') }}</h4>
  <div class="flex flex-col items-center">
    <!-- Student Photo -->
    <div class="relative mb-2">
      <img 
        *ngIf="hasPhoto(selectedStudent)"
        [src]="getStudentPhoto(selectedStudent)"
        [alt]="selectedStudent.firstName + ' ' + selectedStudent.lastName"
        class="w-20 h-20 rounded-full mx-auto object-cover border-2 border-green-400">
      <div 
        *ngIf="!hasPhoto(selectedStudent)" 
        class="w-20 h-20 rounded-full mx-auto border-2 border-green-400 flex items-center justify-center text-4xl bg-green-100 dark:bg-green-800"
        [class.bg-green-50]="selectedStudent.gender === 'male'" 
        [class.bg-pink-50]="selectedStudent.gender === 'female'">
        {{ getDefaultIcon(selectedStudent) }}
      </div>
    </div>
    <div class="text-center">
      <div class="text-xl font-bold text-gray-800 dark:text-gray-100">{{ selectedStudent.firstName }}</div>
      <div class="text-md text-gray-600 dark:text-gray-300">{{ selectedStudent.lastName }}</div>
    </div>
  </div>
</div>
