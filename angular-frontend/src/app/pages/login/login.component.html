<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800 flex items-center justify-center p-4" dir="rtl">
  <div class="w-full max-w-md">
    <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 rounded-2xl shadow-xl dark:shadow-gray-900/50 p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <!-- Logo -->
        <div class="mb-6 flex justify-center">
          <!-- Option 1: Logo with Image (active) -->
          <div class="flex items-center gap-4">
            <img 
              src="assets/images/logo.png" 
              alt="assatida Logo" 
              class="h-16 w-auto object-contain"
              onerror="this.style.display='none'"
            />
            <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-200 dark:text-white">
              {{ translate('login.title') }}
            </h1>
          </div>
          
          <!-- Option 2: Icon Logo with Text (inactive) -->
          <!--
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-600 to-blue-700 dark:from-blue-500 dark:to-blue-600 rounded-xl flex items-center justify-center shadow-lg transform transition-transform hover:scale-105">
              <span class="text-white text-3xl font-bold">A</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-200 dark:text-white">
              {{ translate('login.title') }}
            </h1>
          </div>
          -->
        </div>
        <p class="text-gray-600 dark:text-gray-400 dark:text-gray-300 mt-2">{{ translate('login.subtitle') }}</p>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 dark:bg-red-900/20 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg text-red-700 dark:text-red-400 text-sm">
        {{ errorMessage }}
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Identifier Field -->
        <div>
          <label for="identifier" class="block text-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-300 mb-2">
            {{ translate('login.username') }}
          </label>
          <input
            id="identifier"
            type="text"
            [(ngModel)]="identifier"
            name="identifier"
            class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 dark:bg-gray-700 text-gray-900 dark:text-gray-100 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
            [placeholder]="translate('login.usernamePlaceholder')"
            [disabled]="isLoading"
            required
          />
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 dark:text-gray-300 mb-2">
            {{ translate('login.password') }}
          </label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 dark:bg-gray-700 text-gray-900 dark:text-gray-100 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
            [placeholder]="translate('login.passwordPlaceholder')"
            [disabled]="isLoading"
            required
          />
        </div>

        <!-- reCAPTCHA -->
        <div class="flex justify-center">
          <re-captcha
            [siteKey]="recaptchaSiteKey"
            (resolved)="onCaptchaResolved($event)"
            (expired)="onCaptchaExpired()"
            (error)="onCaptchaError()"
          ></re-captcha>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
        >
          <span *ngIf="!isLoading">{{ translate('login.submit') }}</span>
          <span *ngIf="isLoading" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ translate('login.loading') }}
          </span>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-gray-600 dark:text-gray-400 dark:text-gray-400 text-sm mt-6">
      {{ translate('login.footer') }}
    </p>
  </div>
</div>
