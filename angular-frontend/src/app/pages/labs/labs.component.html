<div class="flex-1 p-6">
  <div class="bg-white rounded-lg shadow-lg p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">إدارة المخبر</h1>
      <div class="flex gap-3">
        <button 
          (click)="openAddModal()"
          class="bg-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-green-700 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <span>إضافة مخبر</span>
        </button>
      </div>
    </div>

    <h2 class="text-xl font-bold text-gray-700 mb-4">قائمة المخابر</h2>

    <div class="overflow-x-auto">
      <table class="w-full border-collapse">
        <thead>
          <tr class="bg-gray-100 border-b-2 border-gray-300">
            <th class="text-right py-3 px-4 font-semibold text-gray-700">اسم المخبر</th>
            <th class="text-right py-3 px-4 font-semibold text-gray-700">الوصف</th>
            <th class="text-right py-3 px-4 font-semibold text-gray-700">الموقع</th>
            <th class="text-right py-3 px-4 font-semibold text-gray-700">الحالة</th>
            <th class="text-right py-3 px-4 font-semibold text-gray-700">الإجراءات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let lab of labs" class="border-b border-gray-200 hover:bg-gray-50">
            <td class="py-3 px-4 text-gray-800">{{ lab.name }}</td>
            <td class="py-3 px-4 text-gray-800">{{ lab.description || '-' }}</td>
            <td class="py-3 px-4 text-gray-800">{{ lab.location || '-' }}</td>
            <td class="py-3 px-4">
              <span 
                [class]="lab.isAvailable 
                  ? 'px-3 py-1 rounded-full text-sm bg-green-100 text-green-800' 
                  : 'px-3 py-1 rounded-full text-sm bg-red-100 text-red-800'">
                {{ lab.isAvailable ? 'متاح' : 'غير متاح' }}
              </span>
            </td>
            <td class="py-3 px-4">
              <div class="flex items-center gap-2">
                <button 
                  (click)="openEditModal(lab)"
                  class="p-2 text-blue-600 hover:bg-blue-50 rounded transition">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                  </svg>
                </button>
                <button 
                  (click)="deleteLab(lab.id)"
                  class="p-2 text-red-600 hover:bg-red-50 rounded transition">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="labs.length === 0">
            <td colspan="5" class="py-8 text-center text-gray-500">لا توجد مخابر</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div 
  *ngIf="showModal"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  (click)="closeModal()">
  <div 
    class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md"
    (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-bold text-gray-800">
        {{ editingLab ? 'تعديل المخبر' : 'إضافة مخبر جديد' }}
      </h3>
      <button 
        (click)="closeModal()"
        class="text-gray-500 hover:text-gray-700">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form #labForm="ngForm" (ngSubmit)="saveLab()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">اسم المخبر *</label>
        <input 
          type="text"
          [(ngModel)]="formData.name"
          name="name"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
          placeholder="أدخل اسم المخبر">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">الوصف</label>
        <textarea 
          [(ngModel)]="formData.description"
          name="description"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
          placeholder="أدخل وصف المخبر"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">الموقع</label>
        <input 
          type="text"
          [(ngModel)]="formData.location"
          name="location"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
          placeholder="أدخل موقع المخبر">
      </div>

      <div class="flex items-center gap-2">
        <input 
          type="checkbox"
          [(ngModel)]="formData.isAvailable"
          name="isAvailable"
          id="isAvailable"
          class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
        <label for="isAvailable" class="text-sm font-medium text-gray-700">المخبر متاح</label>
      </div>

      <div class="flex gap-3 pt-4">
        <button 
          type="submit"
          [disabled]="!labForm.valid"
          class="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed">
          {{ editingLab ? 'تحديث' : 'إضافة' }}
        </button>
        <button 
          type="button"
          (click)="closeModal()"
          class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 transition">
          إلغاء
        </button>
      </div>
    </form>
  </div>
</div>
