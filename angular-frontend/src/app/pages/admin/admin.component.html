<div class="min-h-screen bg-gray-50 p-6" dir="rtl">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-800">
        {{ translate('header.adminPanel') }}
      </h1>
      <p class="text-gray-600 mt-2">
        {{ translate('admin.description') }}
      </p>
    </div>

    <!-- Tabs -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm mb-6">
      <div class="border-b border-gray-200 dark:border-gray-700">
        <nav class="flex -mb-px">
          <button
            (click)="setActiveTab('users')"
            [class]="activeTab === 'users' 
              ? 'border-blue-500 text-blue-600 font-semibold' 
              : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:text-gray-300 hover:border-gray-300 dark:border-gray-600'"
            class="px-6 py-4 border-b-2 transition-colors"
          >
            {{ translate('admin.tabs.users') }}
          </button>
          <button
            (click)="setActiveTab('modules')"
            [class]="activeTab === 'modules' 
              ? 'border-blue-500 text-blue-600 font-semibold' 
              : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:text-gray-300 hover:border-gray-300 dark:border-gray-600'"
            class="px-6 py-4 border-b-2 transition-colors"
          >
            {{ translate('admin.tabs.modules') }}
          </button>
          <button
            (click)="setActiveTab('monitoring')"
            [class]="activeTab === 'monitoring' 
              ? 'border-blue-500 text-blue-600 font-semibold' 
              : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:text-gray-300 hover:border-gray-300 dark:border-gray-600'"
            class="px-6 py-4 border-b-2 transition-colors"
          >
            {{ translate('admin.tabs.monitoring') }}
          </button>
          <button
            (click)="setActiveTab('subscriptions')"
            [class]="activeTab === 'subscriptions' 
              ? 'border-blue-500 text-blue-600 font-semibold' 
              : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:text-gray-300 hover:border-gray-300 dark:border-gray-600'"
            class="px-6 py-4 border-b-2 transition-colors"
          >
            {{ translate('admin.tabs.subscriptions') }}
          </button>
        </nav>
      </div>
    </div>

    <!-- Tab Content -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-6">
      <app-users-management *ngIf="activeTab === 'users'"></app-users-management>
      <app-module-access *ngIf="activeTab === 'modules'"></app-module-access>
      <app-monitoring *ngIf="activeTab === 'monitoring'"></app-monitoring>
      <app-subscription-management *ngIf="activeTab === 'subscriptions'"></app-subscription-management>
    </div>
  </div>
</div>
