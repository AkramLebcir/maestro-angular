<div class="page-wrapper">
  <div class="toolbar">
    <div class="title-group">
      <h1>{{ translate('teacherNotebook.title') }}</h1>
      <p>{{ translate('teacherNotebook.description') }}</p>
    </div>

    <div class="actions">
      <span class="actions-label">{{ translate('teacherNotebook.addNote') }}</span>
      <button class="btn color-yellow" (click)="addNote('yellow')">{{ translate('teacherNotebook.yellow') }}</button>
      <button class="btn color-pink" (click)="addNote('pink')">{{ translate('teacherNotebook.pink') }}</button>
      <button class="btn color-blue" (click)="addNote('blue')">{{ translate('teacherNotebook.blue') }}</button>
      <button class="btn color-green" (click)="addNote('green')">{{ translate('teacherNotebook.green') }}</button>
      <button class="btn clear-btn" (click)="clearAll()" *ngIf="notes.length">
        {{ translate('common.clearAll') }}
      </button>
    </div>
  </div>

  <div class="board" id="board">
    <div
      *ngFor="let note of notes"
      class="sticky"
      [ngClass]="'color-' + note.color"
      [style.left.px]="note.x"
      [style.top.px]="note.y"
      [style.zIndex]="Math.min(note.z, 20)"
      (mousedown)="startDrag($event, note)"
    >
      <div class="sticky-header">
        <span class="dot"></span>
        <button class="delete-btn" (click)="deleteNote(note.id); $event.stopPropagation()">
          ×
        </button>
      </div>
      <textarea
        [(ngModel)]="note.text"
        (input)="onTextChange()"
        [placeholder]="translate('teacherNotebook.placeholder')"
      ></textarea>
    </div>

    <div class="empty-state" *ngIf="!notes.length">
      <p>{{ translate('teacherNotebook.emptyState') }}</p>
    </div>
  </div>
</div>
